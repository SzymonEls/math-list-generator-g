name: Instalator Windows

# Instalator powstaje po wypchnięciu taga (np. v1.0.0) oraz na żądanie
# z zakładki Actions (przycisk "Run workflow").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Numer wersji (np. 1.0.0)"
        required: false
        default: "0.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Ustal numer wersji
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
            if ([string]::IsNullOrWhiteSpace($v)) { $v = '0.0.0' }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Wersja: $v"

      - name: Zainstaluj Inno Setup
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      - name: Zbuduj aplikację i instalator
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build_windows.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Wynik do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: MathListGenerator-${{ steps.version.outputs.version }}-setup
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Dodaj instalator do release'u
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
